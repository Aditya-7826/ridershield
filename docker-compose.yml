services:
  postgres:
    image: postgres:16-alpine
    container_name: ridershield-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridershield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ridershield}
      POSTGRES_DB: ${POSTGRES_DB:-ridershield}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    # Keep Postgres light on a low-RAM laptop
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=8MB
      -c max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ridershield} -d ${POSTGRES_DB:-ridershield}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
